name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验版本一致
        run: node scripts/check-version.mjs
      - name: 校验 tag 与 VERSION 一致
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || (echo "tag 与 VERSION 不一致" && exit 1)
      - name: 运行测试
        run: |
          python -m pip install --upgrade pip requests pytest
          python -m pytest tests -q
      - name: 发布到 npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: 提示未配置 NPM_TOKEN
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::notice::未配置 NPM_TOKEN，跳过 npm 发布。在仓库 Settings → Secrets 添加后可自动发布。"
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
